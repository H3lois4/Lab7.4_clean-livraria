{% extends "base.html" %}
{% block titulo %}Repor estoque – Livraria{% endblock %}
{% block conteudo %}
  <h1>Repor estoque</h1>
  <p class="suave">Área da loja. Quando um livro esgotado volta ao estoque, os clientes que pediram aviso são notificados.</p>
  <form class="formulario" method="post" action="{{ url_for('avisos.atualizar_estoque') }}">
    <label>Livro
      <select name="isbn">
        {% for livro in livros %}<option value="{{ livro.isbn }}">{{ livro.titulo }}</option>{% endfor %}
      </select>
    </label>
    <label>Loja
      <select name="loja_id">
        {% for loja in lojas %}<option value="{{ loja.id }}">{{ loja.nome }}</option>{% endfor %}
      </select>
    </label>
    <label>Nova quantidade
      <input type="number" name="quantidade" min="0" value="1">
    </label>
    <button>Atualizar estoque</button>
  </form>
{% endblock %}
